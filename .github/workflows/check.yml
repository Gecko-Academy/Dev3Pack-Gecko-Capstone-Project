name: check

# Offline CI only: no signer, credentials, live RPC calls, or devnet purchases.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Scan repository for secrets
        run: python3 scripts/scan_secrets.py
      - name: Install locked dependencies
        run: uv sync
      - name: Lint buyer, server, and tests
        run: uv run ruff check buyer server tests
      - name: Run test suite
        run: uv run python -m pytest -q

  recorded-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GECKO_SOURCE: recorded
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync
      - name: Run recorded purchase cases
        run: uv run buyer --cases --recorded
      - name: Run stale and tampered safety cards
        run: uv run buyer --cards --recorded
      - name: Report Project 03 score
        continue-on-error: true
        run: uv run python projects/03-the-part-that-says-no/check.py
